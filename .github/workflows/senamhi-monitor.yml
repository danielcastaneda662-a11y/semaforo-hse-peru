name: Vigilar avisos SENAMHI
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/senamhi_monitor.py
      - .github/workflows/senamhi-monitor.yml
permissions:
  contents: write
concurrency:
  group: senamhi-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar SENAMHI
        run: python scripts/senamhi_monitor.py
      - name: Publicar resultado si cambió
        run: |
          if [ -n "$(git status --porcelain data/senamhi-status.json data/weather.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/senamhi-status.json data/weather.json
            git commit -m "Actualizar vigilancia SENAMHI"
            git push
          fi
